    <main>
        <h3>تواصل معنا</h3>
        <p>يسعدنا استقبال استفساراتكم واقتراحاتكم عبر النموذج التالي:</p>
        
        <form>
            <div>
                <label for="name">الاسم الكامل:</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="phone">رقم الهاتف:</label><br>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <br>
            <div>
                <label for="message">الرسالة أو الاستفسار:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea>
            </div>
            <br>
            <div>
                <button type="submit">إرسال الرسالة</button>
            </div>
        </form>
    </main>
