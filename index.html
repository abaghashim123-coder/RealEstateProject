<!DOCTYPE html>
<html lang="ar" dir="rtl">

<body>

    <header>
        <h2><a href="index.html" style="text-decoration: none; color: black;">عقارات ود مدني</a></h2>
        <nav>
            <a href="index.html">الصفحة الرئيسية</a> | 
            <a href="properties.html">تسجيل الدخول</a>
        </nav>
    </header>

    <hr>

    <main>
        <h3>تسجيل الدخول إلى حسابك</h3>
        <!-- عند الضغط على تسجيل الدخول يتم التوجيه تلقائياً لصفحة العقارات -->
        <form action="properties.html" method="get">
            <div>
                <label for="username">اسم المستخدم:</label><br>
                <input type="text" id="username" name="username" required>
            </div>
            <br>
            <div>
                <label for="password">كلمة المرور:</label><br>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <div>
                <button type="submit" id="login-btn">تسجيل الدخول</button>
            </div>
        </form>
    </main>

    <hr>
