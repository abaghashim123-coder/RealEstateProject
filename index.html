<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقارات ود مدني - تسجيل الدخول</title>
</head>
<body>

    <!-- الترويسة بالعنوان العادي وبدون قوائم علوية -->
    <header>
        <p style="font-weight: bold; font-size: 18px;">عقارات ود مدني</p>
        <nav>
            <a href="index.html">تسجيل الدخول</a>
        </nav>
    </header>

    <hr>

    <!-- نموذج تسجيل الدخول -->
    <main>
        <h2>تسجيل الدخول إلى حسابك</h2>
        <form id="login-form">
            <div>
                <label for="username">اسم المستخدم:</label><br>
                <input type="text" id="username" name="username" required>
            </div>
            <br>
            <div>
                <label for="password">كلمة المرور:</label><br>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <div>
                <button type="submit" id="login-btn">تسجيل الدخول</button>
            </div>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 عقارات ود مدني - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
